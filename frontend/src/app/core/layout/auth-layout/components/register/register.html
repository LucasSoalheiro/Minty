<app-form title="Crie sua conta!" subtitle="Junte-se ao Minty e comece a se organizar hoje mesmo.">
  <form action="" method="post" class="flex flex-col gap-5 w-full max-w-md">
    
    <!-- Input Fields Group -->
    <div class="flex flex-col gap-4">
      
      <!-- Name Field -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </span>
        <input class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition-all duration-200 text-slate-800 placeholder-slate-400 font-medium" type="text" id="name" name="name" placeholder="Nome completo" required />
      </div>

      <!-- Email Field -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
          </svg>
        </span>
        <input class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition-all duration-200 text-slate-800 placeholder-slate-400 font-medium" type="email" id="email" name="email" placeholder="E-mail" required />
      </div>

      <!-- Password Field -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
        </span>
        <input class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition-all duration-200 text-slate-800 placeholder-slate-400 font-medium" type="password" id="password" name="password" placeholder="Senha" required />
      </div>

      <!-- Confirm Password Field -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
          </svg>
        </span>
        <input class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition-all duration-200 text-slate-800 placeholder-slate-400 font-medium" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar senha" required />
      </div>

    </div>

    <!-- Terms Agreement -->
    <div class="flex items-start gap-2.5 text-xs sm:text-sm mt-1">
      <input type="checkbox" id="terms" class="mt-1 w-4.5 h-4.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 focus:ring-offset-0 cursor-pointer" required />
      <label for="terms" class="cursor-pointer select-none text-slate-600 leading-tight">
        Eu aceito os <a href="#" class="text-emerald-600 hover:text-emerald-700 font-bold hover:underline transition-colors">Termos de Serviço</a> e a <a href="#" class="text-emerald-600 hover:text-emerald-700 font-bold hover:underline transition-colors">Política de Privacidade</a>.
      </label>
    </div>

    <!-- Register Button -->
    <button class="w-full py-4 px-6 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 cursor-pointer transform hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-200" type="submit">
      Criar conta
    </button>

    <!-- Switch to Login -->
    <p class="text-center text-sm text-slate-500 mt-1">
      Já possui uma conta? 
      <button type="button" (click)="toggleLogin.emit()" class="text-emerald-600 hover:text-emerald-700 font-bold hover:underline cursor-pointer focus:outline-none">
        Faça login
      </button>
    </p>

  </form>
</app-form>
