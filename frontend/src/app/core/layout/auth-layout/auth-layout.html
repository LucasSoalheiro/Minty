<div class="p-6 bg-gradient-to-tr from-[#52b146] via-[#a3e498] to-[#367931] h-screen flex justify-center items-center font-sans">
  <div class="flex items-center bg-white rounded-[40px] h-[95%] w-[95%] p-6 gap-6 shadow-2xl border border-white/10">
    
    <div class="w-1/2 h-full flex items-center justify-center">
      @if (login) {
        <app-login (toggleRegister)="toggleAuth()"></app-login>
      } @else {
        <app-register (toggleLogin)="toggleAuth()"></app-register>
      }
    </div>
    

    <div class="w-1/2 h-full relative flex flex-col justify-between items-center overflow-hidden bg-gradient-to-br from-[#1b3b18] via-[#2d5a27] to-[#4c7c47] rounded-[30px] p-12 text-white shadow-inner">
      <div class="absolute -top-10 -right-10 w-48 h-48 bg-emerald-400/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-20 -left-10 w-72 h-72 bg-teal-400/10 rounded-full blur-3xl pointer-events-none"></div>


      <div class="relative z-10 flex justify-center items-center flex-1 my-6 max-h-[90%]">
        <img src="assets/biggerSprig.png" class="object-contain max-h-[520px] animate-float drop-shadow-[0_15px_30px_#a3e49899]" alt="Minty Illustration" />
      </div>
    </div>

  </div>
</div>
