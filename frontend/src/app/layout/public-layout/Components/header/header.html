<header class="flex justify-between items-center mx-auto w-full py-5 px-8 md:py-5 md:px-10">
  <!-- Image -->

  <img src="/img/minty-logo.png" class="h-15 object-contain" alt="logo" />

  <!-- Mobile Menu -->
  <div class="md:hidden mt-1">
    <mobile-menu />
  </div>

  <!-- Desktop Links -->
  <nav class="hidden md:flex items-center mt-3 px-2">
    <ul class="flex gap-5 text-center font-medium items-center">
      @for (link of links; track link.href) {
        <li>
          <a [href]="link.href" class="text-slate-600! hover:text-emerald-500! ">
            {{ link.name }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Login Button - desktop -->
  <a href="/auth-login" class="hidden md:flex">
    <button
      class="text-white! w-[150px] bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 h-[50px] my-3 flex items-center justify-center rounded-lg cursor-pointer relative overflow-hidden transition-all duration-500 ease-in-out shadow-md hover:scale-105 hover:shadow-lg before:absolute before:top-0 before:-left-full before:w-full before:h-full before:bg-gradient-to-r before:from-[#009b49] before:to-[rgb(105,184,141)] before:transition-all before:duration-500 before:ease-in-out before:z-[-1] before:rounded-lg hover:before:left-0 text-[#fff]"
    >
      Sign In
    </button>
  </a>
</header>
