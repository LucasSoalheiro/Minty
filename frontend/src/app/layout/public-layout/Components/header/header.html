<header class="flex justify-between items-center mx-auto w-full">
  <div class="flex justify-between md:justify-start items-center w-full p-5">
    <!-- Image -->
    <div class="flex items-center">
      <img src="/img/minty-logo.png" class="h-15 object-contain" alt="logo" />
    </div>

    <!-- Desktop Links -->
    <nav class="hidden md:flex items-center mt-3 px-2">
      <ul class="flex gap-5 text-center font-medium items-center">
        @for (link of links; track link.href) {
          <li>
            <a [href]="link.href" class="font-bold hover:text-emerald-500! hover:underline">
              {{ link.name }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Mobile Menu -->
    <div class="md:hidden ">
      <mobile-menu />
    </div>
    
  </div>

  <!-- Login Button - desktop -->
  <a href="/auth-login" class="hidden md:flex">
    <button
      class="text-white! mx-5 w-[150px] bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 h-[50px] my-3 flex items-center justify-center rounded-xl cursor-pointer relative overflow-hidden transition-all duration-500 ease-in-out shadow-md hover:scale-105 hover:shadow-lg before:absolute before:top-0 before:-left-full before:w-full before:h-full before:bg-gradient-to-r before:from-[#009b49] before:to-[rgb(105,184,141)] before:transition-all before:duration-500 before:ease-in-out before:z-[-1] before:rounded-xl hover:before:left-0 text-[#fff]"
    >
      Entrar
    </button>
  </a>
</header>
